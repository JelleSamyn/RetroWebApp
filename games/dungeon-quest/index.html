<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dungeon Quest</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    
    <div id="ui-layer">
      <div id="score-display">Coins: 0 | Health: 3</div>
      
      <div id="start-screen" class="screen">
        <h1>DUNGEON QUEST</h1>
        <p>Press Enter or (A) to Start</p>
        <p class="controls-hint">Controls: WASD / Arrows / D-pad</p>
      </div>
      
      <div id="game-over-screen" class="screen hidden">
        <h2>GAME OVER</h2>
        <p>Final Score: <span id="final-score">0</span></p>
        <button id="restart-btn" type="button">Restart (Enter / A)</button>
        <button id="home-btn" type="button">Exit to Hub (Esc / B)</button>
      </div>

      <div id="pause-screen" class="screen hidden">
        <h2>PAUSED</h2>
        <button id="resume-btn" type="button">Resume (Esc / Menu)</button>
        <button id="pause-restart-btn" type="button">Restart</button>
        <button id="pause-home-btn" type="button">Exit to Hub</button>
      </div>
    </div>
  </div>
  
  <script src="game.js"></script>
</body>
</html>
